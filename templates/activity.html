{% extends "base.html" %}
{% load static %}

{% block scripts %}
    <script src="{% static 'js/activity.js' %}" defer></script>
{% endblock %}

{% block progress-bar %}
    <div class="bg-gradient-to-r from-blue-500 to-purple-600 h-3 rounded-full transition-all duration-500 ease-out shadow-sm" style="width: 75%"></div>
{% endblock %}

{% block logo %}
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-indigo-500 to-blue-600 rounded-full mb-4">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14,2 L6,2 C4.9,2 4,2.9 4,4 L4,20 C4,21.1 4.9,22 6,22 L18,22 C19.1,22 20,21.1 20,20 L20,8 L14,2 Z"></path><polyline points="14,2 14,8 20,8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10,9 9,9 8,9"></polyline></svg>
        </div>
        <h2 class="text-3xl font-bold gradient-text mb-2">Generated Activity</h2>
        <p class="text-gray-600">Review your Activity</p>
    </div>
{% endblock %}

{% block content %}
    <div class="space-y-8">
        {{html}}
    </div>
{% endblock %}
